<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台首頁 - 管理系統</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../frontend/css/main.css">
    <link rel="stylesheet" href="css/admin.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <!-- 側邊欄 -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header">
                <h2>管理系統</h2>
            </div>
            
            <nav>
                <ul class="admin-nav">
                    <li><a href="dashboard.html" class="active"><i class="fas fa-home"></i> 首頁</a></li>
                    <li><a href="project-editor.html"><i class="fas fa-project-diagram"></i> 專案管理</a></li>
                    <li><a href="devlog-editor.html"><i class="fas fa-book"></i> 開發紀錄</a></li>
                    <li><a href="../frontend/index.html" target="_blank"><i class="fas fa-external-link-alt"></i> 前台網站</a></li>
                    <li><a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> 登出</a></li>
                </ul>
            </nav>
        </aside>
        
        <!-- 主要內容 -->
        <main class="admin-content">
            <div class="admin-header">
                <h1>後台首頁</h1>
            </div>
            
            <!-- 統計卡片 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-project-diagram"></i>
                    <h3 id="project-count">0</h3>
                    <p>專案總數</p>
                </div>
                
                <div class="stat-card">
                    <i class="fas fa-book"></i>
                    <h3 id="devlog-count">0</h3>
                    <p>開發紀錄</p>
                </div>
                
                <div class="stat-card">
                    <i class="fas fa-heart"></i>
                    <h3 id="total-likes">0</h3>
                    <p>總點讚數</p>
                </div>
                
                <div class="stat-card">
                    <i class="fas fa-images"></i>
                    <h3 id="image-count">0</h3>
                    <p>圖片數量</p>
                </div>
            </div>
            
            <!-- 快速操作 -->
            <div class="card">
                <h2>快速操作</h2>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1.5rem;">
                    <a href="project-editor.html" class="btn btn-primary">
                        <i class="fas fa-plus"></i> 新增專案
                    </a>
                    <a href="devlog-editor.html" class="btn btn-primary">
                        <i class="fas fa-plus"></i> 新增開發紀錄
                    </a>
                    <a href="../frontend/index.html" target="_blank" class="btn btn-secondary">
                        <i class="fas fa-eye"></i> 查看前台
                    </a>
                </div>
            </div>
            
            <!-- 最新專案 -->
            <div class="card" style="margin-top: 2rem;">
                <h2>最新專案</h2>
                <div id="latest-projects-list"></div>
            </div>
            
            <!-- 最新開發紀錄 -->
            <div class="card" style="margin-top: 2rem;">
                <h2>最新開發紀錄</h2>
                <div id="latest-devlogs-list"></div>
            </div>
        </main>
    </div>
    
    <!-- JavaScript -->
    <script src="../frontend/js/utils.js"></script>
    <script src="../frontend/js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin-api.js"></script>
    
    <script>
        // 載入統計資料
        async function loadStats() {
            try {
                // 載入專案數量
                const projectsResponse = await api.getAllProjects();
                if (projectsResponse.success) {
                    document.getElementById('project-count').textContent = projectsResponse.data.length;
                }
                
                // 載入開發紀錄數量
                const devlogsResponse = await api.getAllDevlogs();
                if (devlogsResponse.success) {
                    document.getElementById('devlog-count').textContent = devlogsResponse.total || devlogsResponse.data.length;
                }
                
                // 計算總點讚數（簡化版本）
                let totalLikes = 0;
                if (projectsResponse.success) {
                    for (const project of projectsResponse.data) {
                        const likeResponse = await api.getLikeCount('project', project.id);
                        if (likeResponse.success) {
                            totalLikes += likeResponse.count;
                        }
                    }
                }
                document.getElementById('total-likes').textContent = totalLikes;
                
            } catch (error) {
                console.error('載入統計資料失敗:', error);
            }
        }
        
        // 載入最新專案
        async function loadLatestProjects() {
            try {
                const response = await api.getAllProjects();
                const container = document.getElementById('latest-projects-list');
                
                if (response.success && response.data && response.data.length > 0) {
                    const latest = response.data.slice(0, 5);
                    const html = `
                        <ul style="list-style: none; padding: 0;">
                            ${latest.map(project => `
                                <li style="padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1);">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <div>
                                            <strong>${project.title}</strong>
                                            <p style="color: var(--text-secondary); font-size: 0.9rem; margin: 0.5rem 0 0 0;">
                                                ${formatDate(project.created_at, 'date')}
                                            </p>
                                        </div>
                                        <a href="project-editor.html?id=${project.id}" class="btn btn-secondary" style="padding: 0.5rem 1rem;">
                                            編輯
                                        </a>
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    `;
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">目前沒有專案</p>';
                }
            } catch (error) {
                console.error('載入最新專案失敗:', error);
            }
        }
        
        // 載入最新開發紀錄
        async function loadLatestDevlogs() {
            try {
                const response = await api.getAllDevlogs({ limit: 5 });
                const container = document.getElementById('latest-devlogs-list');
                
                if (response.success && response.data && response.data.length > 0) {
                    const html = `
                        <ul style="list-style: none; padding: 0;">
                            ${response.data.map(log => `
                                <li style="padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1);">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <div>
                                            <strong>${log.title}</strong>
                                            <p style="color: var(--text-secondary); font-size: 0.9rem; margin: 0.5rem 0 0 0;">
                                                ${formatDate(log.created_at, 'date')}
                                                ${log.category ? `· ${log.category}` : ''}
                                            </p>
                                        </div>
                                        <a href="devlog-editor.html?id=${log.id}" class="btn btn-secondary" style="padding: 0.5rem 1rem;">
                                            編輯
                                        </a>
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    `;
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">目前沒有開發紀錄</p>';
                }
            } catch (error) {
                console.error('載入最新開發紀錄失敗:', error);
            }
        }
        
        // 頁面載入完成後執行
        document.addEventListener('DOMContentLoaded', async () => {
            // 等待認證檢查完成
            await new Promise(resolve => setTimeout(resolve, 100));
            
            loadStats();
            loadLatestProjects();
            loadLatestDevlogs();
        });
    </script>
</body>
</html>
